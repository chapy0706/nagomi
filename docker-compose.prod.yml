# nagomi 本体 本番用 Docker Compose
# パス: docker-compose.prod.yml（リポジトリルート）
#
# Coolify の設定
#   Build Pack: Docker Compose
#   Base Directory: /
#   Compose File: docker-compose.prod.yml
#
# 今日の教訓（nagomi-ws デプロイ）を反映
#   - coolify ネットワークに繋ぐ（nagomi-db・Garage・Traefik が全て coolify にいる）
#   - Traefik ルーティングは動的設定ファイルで直接書く前提（ラベルは最小限）
#   - サブドメインは1段（nagomi.chapy0706.com）
#   - Next.js は 0.0.0.0 で listen（Dockerfile/start で確認）
#
# 環境変数（Coolify の Environment Variables に設定する）
#   DATA_PROVIDER=a1
#   DATABASE_URL=postgres://nagomi:<pw>@<nagomi-dbコンテナ名>:5432/nagomi
#   MINIO_ENDPOINT=http://<Garageコンテナ名>:3900
#   MINIO_ACCESS_KEY=<Garage の Access Key ID>
#   MINIO_SECRET_KEY=<Garage の Secret>
#   MINIO_PUBLIC_ENDPOINT=（アバター外部公開時に設定・今は未設定で可）
#   NEXT_PUBLIC_REALTIME_PROVIDER=websocket
#   NEXT_PUBLIC_WS_URL=wss://nagomi-ws.chapy0706.com/ws
#   認証関連（Supabase 認証を一旦使う場合）
#   NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY
#   認証関連（Keycloak / OIDC に切り替える場合・issue-33）
#   AUTH_PROVIDER=keycloak
#   AUTH_SECRET=（openssl rand -base64 32 で生成したセッション署名鍵）
#   KEYCLOAK_ISSUER=https://auth.chapy0706.com/realms/nagomi
#   KEYCLOAK_CLIENT_ID=nagomi-web
#   KEYCLOAK_CLIENT_SECRET=（nagomi-web Client の Credentials）

services:
  nagomi:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_REALTIME_PROVIDER: ${NEXT_PUBLIC_REALTIME_PROVIDER:-websocket}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: nagomi
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_REALTIME_PROVIDER=${NEXT_PUBLIC_REALTIME_PROVIDER:-websocket}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - DATA_PROVIDER=${DATA_PROVIDER:-a1}
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}
      # 認証（issue-33）。AUTH_PROVIDER=supabase（既定）で切り戻し可能。
      - AUTH_PROVIDER=${AUTH_PROVIDER:-supabase}
      - AUTH_SECRET=${AUTH_SECRET}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.nagomi.rule=Host(`nagomi.chapy0706.com`)
      - traefik.http.routers.nagomi.entrypoints=http
      - traefik.http.services.nagomi.loadbalancer.server.port=3000

networks:
  coolify:
    external: true
